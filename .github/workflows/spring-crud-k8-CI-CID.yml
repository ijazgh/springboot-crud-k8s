name:  Spring Boot crud k8 and MySQL App to AWS EKS

on:
  workflow_dispatch:
  #push:
     #branches:
     #    - working
     #    - main
env:
  AWS_REGION: us-east-2
  EKS_CLUSTER_NAME: springboot-crud-app-cluster
  KUBE_NAMESPACE: default
  MYSQL_VERSION: 8.4.11
jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '26'

      - name: Build and Test (Maven)
        #working-directory:
        run: mvn -B clean verify

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports
          if-no-files-found: ignore

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '26'

      - name: Build JAR for Docker
        #working-directory:
        run: mvn -B clean package -DskipTests

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }} # this line need to be updated with your DockerHub username stored in GitHub secrets
          password: ${{ secrets.DOCKER_PASSWORD }} # this line need to be updated with your DockerHub password stored in GitHub secrets

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build and Push app Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKER_USERNAME }}/springboot-crud-k8s:latest

      - name: Copy official MySQL image to your Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
            set -euo pipefail
            docker buildx imagetools create \
              --tag "$DOCKER_USERNAME/springboot-mysql:$MYSQL_VERSION" \
              "mysql:$MYSQL_VERSION"


  deploy-aws-eks:
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }} # this line need to be updated with your AWS access key ID
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} # this line need to be updated with your AWS secret access key
          aws-region: ${{ env.AWS_REGION }} # this line need to be updated with your AWS region

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name springboot-crud-app-cluster --region us-east-2
      # this above line need to be updated with your EKS cluster name and region
      - name: Verify connection
        run: kubectl get deployments -n default

      - name: Create database Secret from GitHub Secrets
        env:
            DB_USERNAME: ${{ secrets.DB_USERNAME }}
            DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
            MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
            set -euo pipefail
            
            : "${DB_USERNAME:?Missing DB_USERNAME}"
            : "${DB_PASSWORD:?Missing DB_PASSWORD}"
            : "${MYSQL_ROOT_PASSWORD:?Missing MYSQL_ROOT_PASSWORD}"
            
                       
            kubectl create secret generic mysql-secrets \
              --namespace "$KUBE_NAMESPACE" \
              --from-literal=username="$DB_USERNAME" \
              --from-literal=password="$DB_PASSWORD" \
              --from-literal=root-password="$MYSQL_ROOT_PASSWORD" \
              --dry-run=client \
              -o json |
            kubectl apply \
              --server-side \
              --field-manager=github-actions \
              -f -

      - name: Deploy to AWS (Kubernetes)
        run: |
            set -e
            
            kubectl apply -f mysql-configMap.yaml -n default
            
            kubectl apply -f k8db-deployment.yaml -n default
            kubectl rollout status deployment/mysql \
              -n default --timeout=600s
            
            kubectl apply -f k8app-deployment.yaml -n default
            kubectl rollout restart deployment/springboot-crud-deployment \
              -n default
            kubectl rollout status deployment/springboot-crud-deployment \
              -n default --timeout=600s